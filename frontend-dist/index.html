<!doctype html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <script data-cfasync="false">
    (() => {
      const root = document.documentElement;
      let cached = {};
      try { cached = JSON.parse(localStorage.getItem('vuex') || '{}') || {}; } catch {}
      const hour = new Date().getHours();
      const dark = cached.cusDarkMode && typeof cached.useDarkMode === 'boolean'
        ? cached.useDarkMode
        : matchMedia('(prefers-color-scheme: dark)').matches || hour >= 22 || hour < 6;
      root.classList.add('entry-loading');
      root.classList.toggle('dark', dark);
      const configReady = fetch('/api/userConfig', { credentials: 'same-origin' })
        .then(response => response.ok ? response.json() : null)
        .catch(() => null);
      window.__siteEntryBootstrap = { config: cached.userConfig, configReady };
    })();
  </script>
  <style>
    html.entry-loading { background: #f5f5f7; }
    html.entry-loading.dark { background: #0f0f0f; color-scheme: dark; }
  </style>
  
  <!-- ================= ⬇️ 新增：去除毛玻璃、全透明 CSS ⬇️ ================= -->
  <style>
    /* 1. 全局彻底禁用毛玻璃和高斯模糊 */
    *,
    *::before,
    *::after {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    /* 2. 覆盖 Element UI / Vue 组件库的基础背景变量 */
    :root {
      --el-bg-color: transparent !important;
      --el-bg-color-overlay: transparent !important;
      --el-fill-color-blank: transparent !important;
      --el-fill-color-light: transparent !important;
      --el-border-color: rgba(255, 255, 255, 0.2) !important; /* 边框改为极淡的半透明 */
    }

    /* 3. 主要容器、工具栏、面板透明化 */
    .quick-toolbar,
    .quick-toolbar-actions,
    .quick-toolbar-actions-inner,
    .upload-list-dashboard,
    .el-card,
    .el-dialog,
    .el-menu,
    .el-dropdown-menu {
      background: transparent !important;
      background-color: transparent !important;
      box-shadow: none !important;
      border: none !important;
    }

    /* 4. 按钮、图标、输入框透明化 */
    .quick-toolbar-button,
    .modern-action-btn,
    .mobile-more-button,
    .directory-tree-trigger,
    .el-input__wrapper {
      background: transparent !important;
      background-color: transparent !important;
      box-shadow: none !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important; /* 保留微弱边框以免找不到 */
    }

    /* 5. 悬停交互时给一点点极其微弱的反馈，否则容易误触 */
    .quick-toolbar-button:hover,
    .modern-action-btn:hover,
    .directory-tree-trigger:hover {
      background: rgba(255, 255, 255, 0.1) !important;
    }

    /* 6. 拖拽上传区域透明化 */
    .el-upload--text,
    .el-upload-dragger {
      background: transparent !important;
      background-color: transparent !important;
      box-shadow: none !important;
      border: 2px dashed rgba(255, 255, 255, 0.3) !important; /* 虚线框 */
    }
    
    /* 7. 如果背景图太花导致看不清文字，可以在设置里调回深色模式，或者在下方添加文字阴影 */
    #app, .el-text {
      text-shadow: 0 1px 3px rgba(0,0,0,0.5); /* 给文字加一点点阴影，防止全透明后看不见字 */
    }
  </style>
